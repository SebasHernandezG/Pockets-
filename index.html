<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#254d40" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Tus ingresos y gastos en colones, claros y en un solo lugar. Pockets: control de gastos, historial y reportes PDF." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pockets · Tus gastos, claros</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('pockets.theme');
        document.documentElement.dataset.theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
